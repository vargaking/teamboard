# Host nginx: ONE public port and ONE hostname/IP, apps routed by path prefix.
# TeamBoard is served under /board/ ; build the frontend with VITE_BASE=/board/ (see README "Deploying under a path prefix").

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 5m;

    # OAuth discovery for TeamBoard's MCP connector (origin-root paths that embed the /board prefix).
    # Forwarded as-is: the container nginx routes /.well-known/oauth-* to the API, which registers these exact paths.
    location /.well-known/oauth-authorization-server/board/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /.well-known/oauth-protected-resource/board/ { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

    # TeamBoard under /board/  -> container nginx on 127.0.0.1:8080 (which serves the SPA at / and the API at /api/)
    location = /board { return 301 /board/; }
    location /board/ {
        proxy_pass http://127.0.0.1:8080/;   # trailing slash strips the /board prefix
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Lucrum at the root
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
