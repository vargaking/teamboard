# Host nginx: ONE public port, several apps, routed by hostname.
# Install as /etc/nginx/sites-available/teamboard, symlink into sites-enabled, `nginx -t`, `systemctl reload nginx`.
# Requires DNS (or /etc/hosts on clients) for each hostname pointing at the VM.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- TeamBoard (this repo; its compose binds to 127.0.0.1:8080) ---
server {
    listen 80;
    server_name board.example.com;          # <- change

    client_max_body_size 30m;   # Trello imports send the whole export as JSON

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (live updates on /api/ws/...)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

# --- The SEP project (Lucrum) on another local port, e.g. 127.0.0.1:8090 ---
server {
    listen 80;
    server_name lucrum.example.com;         # <- change

    location / {
        proxy_pass http://127.0.0.1:8090;    # <- whatever port Lucrum's own nginx/app binds on localhost
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
