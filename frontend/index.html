<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeamBoard</title>
    <script>
      // Apply the saved theme before first paint (no light flash). Same key/logic as ThemeModeContext.
      (function () {
        var mode = 'system';
        try {
          var stored = localStorage.getItem('teamboard_theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') mode = stored;
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <style>
      /* Before the CSS bundle loads: avoid a white flash in dark mode. */
      html[data-theme='dark'] { background: #0f1115; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
