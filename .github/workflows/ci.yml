name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamboard
          POSTGRES_PASSWORD: teamboard
          POSTGRES_DB: teamboard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teamboard" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests && ruff format --check app tests
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgres://teamboard:teamboard@localhost:5432/teamboard_test
      - name: Migrations are up to date
        run: |
          aerich upgrade
          # `aerich migrate` must report no model changes compared to the committed migrations
          aerich migrate --name ci_check | tee /tmp/migrate.log
          grep -q "No changes detected" /tmp/migrate.log
        env:
          DATABASE_URL: postgres://teamboard:teamboard@localhost:5432/teamboard_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy-backend:
    # Render is deployed from here, only after backend + frontend checks pass on master.
    # Requires the repository secret RENDER_DEPLOY_HOOK (Render -> service -> Settings -> Deploy Hook).
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret is not set; skipping Render deploy"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" && echo "Render deploy triggered"
