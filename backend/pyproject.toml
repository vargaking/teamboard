[project]
name = "teamboard-backend"
version = "1.0.0"
description = "TeamBoard API - Trello-like board for a 12-person team (FastAPI + Tortoise ORM + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tortoise-orm[asyncpg]>=0.21",
    "aerich>=0.8",
    "tomlkit>=0.13",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "websockets>=12",
    "anthropic>=0.40",
    "openai>=1.50",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "aiosqlite>=0.20", "ruff>=0.6"]

[tool.aerich]
tortoise_orm = "app.db.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
